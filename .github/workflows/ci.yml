name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: financas_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Aguardar o MySQL ficar pronto
        run: sleep 5

      - name: Executar testes com Maven
        # Forçamos o datasource, driver, credenciais e passamos um profile vazio ou test para ignorar o 'local'
        run: >
          mvn clean test
          -Dspring.datasource.url="jdbc:mysql://localhost:3306/financas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
          -Dspring.datasource.username=root
          -Dspring.datasource.password=123456
          -Dspring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
          -DJWT_SECRET=suaChaveSecretaSuperSeguraParaTestesNoGithubActions123456
          -Dspring.profiles.active=ci