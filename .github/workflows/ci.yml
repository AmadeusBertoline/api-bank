name: CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: financas_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456" --health-interval=5s --health-timeout=2s --health-retries=10

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Aguardar o MySQL estar 100% pronto
        run: |
          echo "Aguardando o MySQL inicializar..."
          until mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent; do
            sleep 3
          done
          echo "MySQL está pronto e aceitando conexões!"

      - name: Injetar propriedades no profile local para o CI
        run: |
          mkdir -p src/test/resources
          echo "spring.datasource.url=jdbc:mysql://127.0.0.1:3306/financas_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true" >> src/test/resources/application-local.properties
          echo "spring.datasource.username=root" >> src/test/resources/application-local.properties
          echo "spring.datasource.password=123456" >> src/test/resources/application-local.properties
          echo "spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver" >> src/test/resources/application-local.properties
          echo "jwt.secret=suaChaveSecretaSuperSeguraParaTestesNoGithubActions123456" >> src/test/resources/application-local.properties

      - name: Executar testes com Maven
        run: mvn clean test