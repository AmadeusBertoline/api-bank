# Banco de Dados no Docker (aponta para o serviço 'db' da rede Docker)
spring.datasource.url=jdbc:mysql://db:3306/financas_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=rootpass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA e Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Docker
jwt.secret=${JWT_SECRET:4f7a93b2d6e1f8c7a5b3e2d1f0c9b8a7f6e5d4c3b2a10f9e8d7c6b5a4f3e2d1c}
jwt.expiration=86400000

server.port=8080

