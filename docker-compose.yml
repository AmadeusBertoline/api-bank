version: '3.8'

services:
  # Serviço 1: Banco de Dados MySQL
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: financas_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

      # NOVO: Serviço de Cache Redis
  cache:
    image: redis:7-alpine
    container_name: redis-cache
    restart: always
    ports:
      - "6379:6379"

  # Serviço 2: Sua API Spring Boot
  api:
    build: .
    container_name: minha-api-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/financas_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: "123456"
      # NOVAS LINHAS: Comunicação da API com o container do Redis
      SPRING_DATA_REDIS_HOST: cache
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - db
      - cache

# Persistência de dados do MySQL no seu HD
volumes:
  mysql_data: